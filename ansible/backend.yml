---
- name: Configure Backend Server (Runtime)
  hosts: all
  become: yes
  tasks:
    - name: Install Java Runtime
      apt:
        name: openjdk-17-jre-headless
        state: present
        update_cache: yes

    - name: Create app directory
      file:
        path: /opt/backend
        state: directory
        owner: vagrant
        group: vagrant
        mode: 0755

    - name: Create systemd service
      copy:
        dest: /etc/systemd/system/spring-boot.service
        content: |
          [Unit]
          Description=Spring Boot App
          After=network.target
          [Service]
          User=vagrant
          WorkingDirectory=/opt/backend
          ExecStart=/usr/bin/java -jar app.jar --spring.datasource.url=jdbc:postgresql://{{ db_host }}:{{ db_port }}/{{ db_name }} --spring.datasource.username={{ db_user }} --spring.datasource.password={{ db_password }} --server.port=8080
          Restart=always
          [Install]
          WantedBy=multi-user.target
      notify: Reload Systemd

    - name: Enable Password Authentication for SSH
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "^#?PasswordAuthentication"
        line: "PasswordAuthentication yes"
      notify: Restart SSH

    - name: Set password for vagrant user
      shell: echo "vagrant:vagrant" | chpasswd

  handlers:
    - name: Reload Systemd
      systemd: daemon_reload=yes

    - name: Restart SSH
      service: name=ssh state=restarted
